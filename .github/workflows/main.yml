name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: دریافت کدها
      uses: actions/checkout@v4

    - name: نصب JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: نصب Gradle (برای ساختن Wrapper)
      run: |
        sudo apt update
        sudo apt install -y gradle

    - name: ساخت فایل‌های Wrapper (اگر وجود نداشت)
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: ساخت APK با Gradle
      run: ./gradlew assembleRelease

    - name: آپلود APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
